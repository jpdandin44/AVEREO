openapi: 3.1.0
info:
  title: AVEREO CONNECT API
  version: 0.2.0-c7
  license:
    name: Propriétaire — usage interne AVEREO
    identifier: LicenseRef-AVEREO-Proprietary
  description: >-
    Contrat C7/V2. Le fournisseur d'identité Drupal est activé lorsque les
    variables OAuth sont complètes ; les routes protégées refusent toute
    requête sans session serveur valide.
servers:
  - url: /api/v1
tags:
  - name: System
    description: Santé et diagnostic non sensible du service.
  - name: Session
    description: Session serveur et frontière d'identité Drupal.
  - name: Organizations
    description: Espaces Pro, adhésions et contrôles d'accès.
  - name: Catalog
    description: Applications AVEREO et habilitations organisationnelles.
  - name: Administration
    description: Approbation et cycle de vie des comptes CONNECT.
security:
  - sessionCookie: []
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Santé de l'API sans donnée sensible
      security: []
      responses:
        "200":
          description: État du service et de la connexion à la base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /session:
    get:
      tags: [Session]
      operationId: getSession
      summary: État de la session et jeton CSRF de même origine
      security: []
      responses:
        "200":
          description: État anonyme ou authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /catalog:
    get:
      tags: [Catalog]
      operationId: getApplicationCatalog
      summary: Applications AVEREO proposées à une identité Drupal validée
      description: >-
        Retourne uniquement les applications actives du catalogue pour lesquelles
        le compte CONNECT possède une habilitation organisationnelle valide.
      responses:
        "200":
          description: Applications publiées et habilitées
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogApplication"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /apps/{applicationCode}/launch:
    get:
      tags: [Catalog]
      operationId: launchApplication
      summary: Ouvrir une application au moyen d'un ticket CONNECT signe
      parameters:
        - name: applicationCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{1,63}$"
      responses:
        "303":
          description: Redirection vers le point d'entree prive de l'application
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          description: Compte CONNECT non approuve ou application non habilitee
        "503":
          description: Credential ou point d'entree applicatif non configure
  /auth/login:
    get:
      tags: [Session]
      operationId: navigateToLogin
      summary: Démarrer Authorization Code avec PKCE par navigation
      security: []
      responses:
        "303":
          description: Redirection vers Drupal
        "503":
          $ref: "#/components/responses/IdentityNotConfigured"
    post:
      tags: [Session]
      operationId: startLogin
      summary: Démarrer Authorization Code avec PKCE
      description: Disponible lorsque la configuration OAuth est complète.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                remember:
                  type: boolean
      responses:
        "303":
          description: Redirection vers Drupal
        "503":
          $ref: "#/components/responses/IdentityNotConfigured"
  /auth/callback:
    get:
      tags: [Session]
      operationId: finishLogin
      summary: Callback serveur OAuth2/OIDC
      description: Valide la transaction OAuth et ouvre la session CONNECT.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          required: true
          schema:
            type: string
            maxLength: 256
      responses:
        "303":
          description: Redirection vers CONNECT après ouverture de session
        "503":
          $ref: "#/components/responses/IdentityNotConfigured"
  /auth/logout:
    post:
      tags: [Session]
      operationId: logout
      summary: Détruire la session CONNECT
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Session détruite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "403":
          $ref: "#/components/responses/CsrfRejected"
  /me:
    get:
      tags: [Session]
      operationId: getMe
      summary: Profil CONNECT minimal de l'utilisateur courant
      responses:
        "200":
          description: Profil sans jeton OAuth ni mot de passe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: Espaces Pro actifs de l'utilisateur courant
      responses:
        "200":
          description: Organisations visibles par adhésion active
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /apps:
    get:
      tags: [Catalog]
      operationId: listApplications
      summary: Applications actives et habilitées pour un Espace Pro
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Catalogue filtré côté serveur
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Application"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/OrganizationAccessDenied"
        "422":
          $ref: "#/components/responses/ValidationError"
  /organizations/{organizationId}/entitlements:
    get:
      tags: [Organizations, Catalog]
      operationId: listEntitlements
      summary: Habilitations applicatives d'un Espace Pro
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Habilitations visibles par un membre actif
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entitlement"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/OrganizationAccessDenied"
  /organizations/{organizationId}/entitlements/{applicationCode}:
    put:
      tags: [Organizations, Catalog]
      operationId: putEntitlement
      summary: Créer ou modifier une habilitation
      description: >-
        Réservé aux rôles owner et admin. La mutation et son événement d'audit
        de succès sont écrits dans la même transaction.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: applicationCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{1,63}$"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitlementInput"
      responses:
        "200":
          description: Habilitation enregistrée et auditée
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/Entitlement"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          description: Rôle insuffisant, Espace Pro inaccessible ou CSRF rejeté
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application inconnue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /admin/organizations/{organizationId}/accounts:
    get:
      tags: [Administration]
      operationId: getAccountAdministration
      summary: Tableau d'administration des comptes
      description: Réservé aux rôles owner et admin de l'organisation.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Demandes, comptes et applications héritées
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/AccountAdministration"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/OrganizationAccessDenied"
  /admin/organizations/{organizationId}/pending-identities/{pendingIdentityId}/approve:
    post:
      tags: [Administration]
      operationId: approvePendingIdentity
      summary: Approuver une identité Drupal en attente
      description: >-
        Crée ou réactive le compte CONNECT, son adhésion active et une trace
        d'audit atomique. Un admin ne peut attribuer que member ou viewer.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PendingIdentityId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Compte approuvé
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/ManagedUser"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          description: Rôle insuffisant ou CSRF rejeté
        "404":
          description: Demande introuvable
        "409":
          description: Demande déjà traitée ou conflit d'identité
        "422":
          $ref: "#/components/responses/ValidationError"
  /admin/organizations/{organizationId}/pending-identities/{pendingIdentityId}/reject:
    post:
      tags: [Administration]
      operationId: rejectPendingIdentity
      summary: Refuser une identité Drupal en attente
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PendingIdentityId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Demande refusée et auditée
        "403":
          description: Rôle insuffisant ou CSRF rejeté
        "404":
          description: Demande introuvable
        "409":
          description: Demande déjà traitée
  /admin/organizations/{organizationId}/users/{userId}/status:
    patch:
      tags: [Administration]
      operationId: updateManagedUserStatus
      summary: Activer, suspendre ou désactiver un compte CONNECT
      description: >-
        Réservé au rôle owner. La modification de son propre statut et la
        désactivation du dernier owner actif sont refusées.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusInput"
      responses:
        "200":
          description: Statut enregistré et audité
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/ManagedUser"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          description: Rôle insuffisant ou CSRF rejeté
        "404":
          description: Compte introuvable
        "409":
          description: Protection du compte courant ou du dernier owner
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: AVEREO_CONNECT_SESSION
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PendingIdentityId:
      name: pendingIdentityId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
  responses:
    AuthenticationRequired:
      description: Session absente ou expirée
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    OrganizationAccessDenied:
      description: Refus par défaut, adhésion ou ressource indisponible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CsrfRejected:
      description: Jeton CSRF absent ou invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Entrée invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdentityNotConfigured:
      description: Fournisseur Drupal non configuré
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          minLength: 8
          maxLength: 64
    HealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status, service, database, time]
          properties:
            status:
              type: string
              enum: [ok, degraded]
            service:
              const: avereo-connect-api
            database:
              type: string
              enum: [ok, not_configured, unavailable]
            time:
              type: string
              format: date-time
        meta:
          $ref: "#/components/schemas/Meta"
    SessionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [authenticated, approved, accountStatus, remembered, csrfToken]
          properties:
            authenticated:
              type: boolean
            approved:
              type: boolean
            accountStatus:
              type: [string, "null"]
              enum: [active, pending, rejected, suspended, disabled, null]
            remembered:
              type: boolean
            csrfToken:
              type: string
            registrationUrl:
              type: [string, "null"]
              format: uri
        meta:
          $ref: "#/components/schemas/Meta"
    UserResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/Meta"
    User:
      type: object
      required: [id, drupalSubject, email, displayName, status]
      properties:
        id:
          type: integer
          minimum: 1
        drupalSubject:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum: [active]
    AccountAdministration:
      type: object
      required:
        [organization, actorRole, assignableRoles, applications, pendingIdentities, users]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        actorRole:
          type: string
          enum: [owner, admin]
        assignableRoles:
          type: array
          items:
            type: string
            enum: [owner, admin, member, viewer]
        applications:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code:
                type: string
              name:
                type: string
        pendingIdentities:
          type: array
          items:
            $ref: "#/components/schemas/PendingIdentity"
        users:
          type: array
          items:
            $ref: "#/components/schemas/ManagedUser"
    PendingIdentity:
      type: object
      required: [id, firstSeenAt, lastSeenAt]
      properties:
        id:
          type: integer
          minimum: 1
        email:
          type: [string, "null"]
          format: email
        displayName:
          type: [string, "null"]
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    ManagedUser:
      type: object
      required: [id, email, displayName, status, role]
      properties:
        id:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum: [active, suspended, disabled]
        role:
          type: string
          enum: [owner, admin, member, viewer]
        membershipStatus:
          type: string
          enum: [active, suspended, revoked]
        canChangeStatus:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ApprovalInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, admin, member, viewer]
    UserStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended, disabled]
    Organization:
      type: object
      required: [id, name, slug, status, role]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active]
        role:
          type: string
          enum: [owner, admin, member, viewer]
    Application:
      type: object
      required: [code, name, launchUrl, entitlementStatus]
      properties:
        code:
          type: string
        name:
          type: string
        launchUrl:
          type: string
          format: uri-reference
        requiredScope:
          type: [string, "null"]
        entitlementStatus:
          type: string
          enum: [active]
        validFrom:
          type: [string, "null"]
          format: date-time
        validTo:
          type: [string, "null"]
          format: date-time
    CatalogApplication:
      type: object
      required: [code, name, description, launchUrl, available, status]
      properties:
        code:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{1,63}$"
        name:
          type: string
        description:
          type: string
        launchUrl:
          type: string
          format: uri-reference
        available:
          type: boolean
        status:
          type: string
          enum: [available, configuration_required]
    Entitlement:
      type: object
      required: [applicationCode, status]
      properties:
        applicationCode:
          type: string
        applicationName:
          type: string
        status:
          type: string
          enum: [active, suspended, revoked]
        validFrom:
          type: [string, "null"]
          format: date-time
        validTo:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EntitlementInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended, revoked]
        validFrom:
          type: [string, "null"]
          format: date-time
        validTo:
          type: [string, "null"]
          format: date-time
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          $ref: "#/components/schemas/Meta"
