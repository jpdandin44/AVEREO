openapi: 3.1.0
info:
  title: AVEREO CONNECT API
  version: 0.2.0-c7
  license:
    name: Propriétaire — usage interne AVEREO
    identifier: LicenseRef-AVEREO-Proprietary
  description: >-
    Contrat C7/V2. Le fournisseur d'identité Drupal est activé lorsque les
    variables OAuth sont complètes ; les routes protégées refusent toute
    requête sans session serveur valide.
servers:
  - url: /api/v1
tags:
  - name: System
    description: Santé et diagnostic non sensible du service.
  - name: Session
    description: Session serveur et frontière d'identité Drupal.
  - name: Organizations
    description: Espaces Pro, adhésions et contrôles d'accès.
  - name: Catalog
    description: Applications AVEREO et habilitations organisationnelles.
  - name: Administration
    description: Approbation et cycle de vie des comptes CONNECT.
security:
  - sessionCookie: []
paths:
  /me/preferences:
    get:
      tags: [Session]
      operationId: readOwnPreferences
      summary: Lire le médaillon du seul compte actif de la session CONNECT
      description: >-
        Réponse privée no-store. Les lectures interorigines exigent l'origine exacte
        d'une application de lancement configurée et une habilitation actuelle à cette application.
        Aucun identifiant de compte cible n'est accepté. Aucun accès anonyme ou CORS joker.
      parameters:
        - name: application
          in: query
          required: false
          schema: {type: string}
          description: Code applicatif requis pour une lecture interorigine.
      responses:
        "200":
          description: Préférence du compte courant et contexte opaque lié à la session.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [accountBadge, accountContext]
                    additionalProperties: false
                    properties:
                      accountBadge: {type: string, description: Une à trois lettres ou chiffres Unicode, default: MOI}
                      accountContext: {type: string, pattern: '^[a-f0-9]{64}$'}
                  meta: {type: object}
        "401": {description: Session anonyme}
        "403": {description: Compte inactif, origine ou application refusée}
        "503": {description: Service non configuré}
    put:
      tags: [Session]
      operationId: saveOwnPreferences
      summary: Enregistrer le médaillon de son compte depuis CONNECT uniquement
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
        - name: X-Account-Context
          in: header
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{64}$'}
          description: Contexte reçu lors de la lecture des préférences du même compte et de la même session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountBadge]
              properties:
                accountBadge: {type: string, description: Une à trois lettres ou chiffres Unicode}
      responses:
        "200": {description: Valeur accountBadge enregistrée dans l'enveloppe data/meta}
        "401": {description: Session anonyme}
        "403": {description: CSRF, compte ou origine refusés}
        "409": {description: Le formulaire appartient à un autre compte ou une ancienne session}
        "413": {description: Corps supérieur à 512 octets}
        "422": {description: Valeur ou champ inattendu}
        "503": {description: Service non configuré}
  /appearance:
    get:
      tags: [System]
      operationId: readPublicAppearance
      summary: Modèle visuel public de cet environnement
      security: []
      responses:
        "200": {$ref: "#/components/responses/Appearance"}
  /admin/appearance:
    get:
      tags: [Administration]
      operationId: readAdminAppearance
      summary: Lire le modèle dans l’administration AVEREO
      responses:
        "200": {$ref: "#/components/responses/Appearance"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/OrganizationAccessDenied"}
    put:
      tags: [Administration]
      operationId: updateAdminAppearance
      summary: Appliquer le modèle commun à cet environnement
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Appearance"}
      responses:
        "200": {$ref: "#/components/responses/Appearance"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {description: Autorisation ou jeton CSRF refusé}
        "422": {description: Paramètres hors du modèle}
        "503": {description: Stockage privé indisponible}
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Santé de l'API sans donnée sensible
      security: []
      responses:
        "200":
          description: État du service et de la connexion à la base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /session:
    get:
      tags: [Session]
      operationId: getSession
      summary: État de la session et jeton CSRF de même origine
      security: []
      responses:
        "200":
          description: État anonyme ou authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /catalog:
    get:
      tags: [Catalog]
      operationId: getApplicationCatalog
      summary: Applications AVEREO proposées à une identité Drupal validée
      description: >-
        Retourne uniquement les applications actives du catalogue pour lesquelles
        le compte CONNECT possède une habilitation organisationnelle valide.
      responses:
        "200":
          description: Applications publiées et habilitées
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogApplication"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /apps/{applicationCode}/launch:
    get:
      tags: [Catalog]
      operationId: launchApplication
      summary: Ouvrir une application au moyen d'un ticket CONNECT signe
      description: Le raccourci de catalogue RGA utilise applicationCode=rapport et ses droits. Aucune habilitation autonome RGA.
      parameters:
        - name: applicationCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{1,63}$"
        - name: view
          in: query
          required: false
          description: La valeur rga avec applicationCode=rapport ouvre la carte après échange du ticket. Toute autre valeur est ignorée ; aucune URL libre.
          schema:
            type: string
      responses:
        "303":
          description: Redirection vers le point d'entree prive de l'application
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          description: Compte CONNECT non approuve ou application non habilitee
        "503":
          description: Credential ou point d'entree applicatif non configure
  /auth/login:
    get:
      tags: [Session]
      operationId: navigateToLogin
      summary: Démarrer Authorization Code avec PKCE par navigation
      security: []
      responses:
        "303":
          description: Redirection vers Drupal
        "503":
          $ref: "#/components/responses/IdentityNotConfigured"
    post:
      tags: [Session]
      operationId: startLogin
      summary: Démarrer Authorization Code avec PKCE
      description: Disponible lorsque la configuration OAuth est complète.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                remember:
                  type: boolean
      responses:
        "303":
          description: Redirection vers Drupal
        "503":
          $ref: "#/components/responses/IdentityNotConfigured"
  /auth/callback:
    get:
      tags: [Session]
      operationId: finishLogin
      summary: Callback serveur OAuth2/OIDC
      description: Valide la transaction OAuth et ouvre la session CONNECT.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          required: true
          schema:
            type: string
            maxLength: 256
      responses:
        "303":
          description: Redirection vers CONNECT après ouverture de session
        "503":
          $ref: "#/components/responses/IdentityNotConfigured"
  /auth/logout:
    post:
      tags: [Session]
      operationId: logout
      summary: Détruire les sessions AVEREO
      description: >-
        Ferme la session CONNECT et retourne une URL de déconnexion signée,
        de courte durée, qui ferme le fournisseur d'identité sans exposer son
        interface à l'utilisateur.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Session détruite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "403":
          $ref: "#/components/responses/CsrfRejected"
  /me:
    get:
      tags: [Session]
      operationId: getMe
      summary: Profil CONNECT minimal de l'utilisateur courant
      responses:
        "200":
          description: Profil sans jeton OAuth ni mot de passe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: Espaces Pro actifs de l'utilisateur courant
      responses:
        "200":
          description: Organisations visibles par adhésion active
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /apps:
    get:
      tags: [Catalog]
      operationId: listApplications
      summary: Applications actives et habilitées pour un Espace Pro
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Catalogue filtré côté serveur
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Application"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/OrganizationAccessDenied"
        "422":
          $ref: "#/components/responses/ValidationError"
  /organizations/{organizationId}/entitlements:
    get:
      tags: [Organizations, Catalog]
      operationId: listEntitlements
      summary: Habilitations applicatives d'un Espace Pro
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Habilitations visibles par un membre actif
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entitlement"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/OrganizationAccessDenied"
  /organizations/{organizationId}/entitlements/{applicationCode}:
    put:
      tags: [Organizations, Catalog]
      operationId: putEntitlement
      summary: Créer ou modifier une habilitation
      description: >-
        Réservé aux rôles owner et admin. La mutation et son événement d'audit
        de succès sont écrits dans la même transaction.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: applicationCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{1,63}$"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitlementInput"
      responses:
        "200":
          description: Habilitation enregistrée et auditée
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/Entitlement"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          description: Rôle insuffisant, Espace Pro inaccessible ou CSRF rejeté
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application inconnue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /identity/account-activation-complete:
    get:
      tags: [Identity]
      operationId: completeAccountActivation
      summary: Confirmer la définition du mot de passe
      description: >-
        Callback HMAC court émis par le pont d'identité après la définition
        effective du mot de passe. Aucun accès applicatif n'est ouvert avant
        cette confirmation.
      parameters:
        - name: iat
          in: query
          required: true
          schema:
            type: integer
        - name: nonce
          in: query
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: signature
          in: query
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
      responses:
        "303":
          description: Activation confirmée et retour vers CONNECT
        "403":
          description: Signature invalide ou expirée
  /admin/organizations/{organizationId}/accounts:
    post:
      tags: [Administration]
      operationId: createPreparedAccount
      summary: Créer un compte membre et ses accès sans envoyer de mail
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, displayName, applications]
              properties:
                email: {type: string, format: email, maxLength: 254}
                displayName: {type: string, minLength: 1, maxLength: 191}
                applications:
                  type: array
                  description: Applications disponibles choisies explicitement, en accès temporaire ou permanent. Leur sélection ne modifie pas la période du compte.
                  minItems: 1
                  maxItems: 32
                  uniqueItems: true
                  items: {type: string}
                startsAt: {type: [string, "null"], format: date-time}
                endsAt: {type: [string, "null"], format: date-time}
                linkExisting:
                  type: boolean
                  default: false
                  description: Choix explicite réservé au propriétaire pour rattacher une identité AVEREO existante.
      responses:
        "201":
          description: Compte préparé, invitation non envoyée
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, email, displayName, invitationSent, identityLinked]
                    properties:
                      id: {type: integer}
                      email: {type: string, format: email}
                      displayName: {type: string}
                      invitationSent: {type: boolean}
                      identityLinked: {type: boolean}
        "403": {description: 'Rôle, organisation ou CSRF refusé'}
        "409": {description: Compte ou identité existant sans rapprochement automatique}
        "422": {description: 'Champs, applications ou période invalides'}
        "502": {description: Provisionnement non confirmé}
        "503": {description: Paramètres privés de création indisponibles}
    get:
      tags: [Administration]
      operationId: getAccountAdministration
      summary: Tableau d'administration des comptes
      description: Réservé aux rôles owner et admin de l'organisation.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Demandes, comptes et applications héritées
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/AccountAdministration"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/OrganizationAccessDenied"
  /admin/organizations/{organizationId}/pending-identities/{pendingIdentityId}/approve:
    post:
      tags: [Administration]
      operationId: approvePendingIdentity
      summary: Approuver une identité Drupal en attente
      description: >-
        Crée ou réactive le compte CONNECT, son adhésion active et une trace
        d'audit atomique, puis demande à l'identité AVEREO d'envoyer un lien
        unique de définition du mot de passe valable 24 heures. Un admin ne
        peut attribuer que member ou viewer.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PendingIdentityId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Compte approuvé
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/ManagedUser"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          description: Rôle insuffisant ou CSRF rejeté
        "404":
          description: Demande introuvable
        "409":
          description: Demande déjà traitée ou conflit d'identité
        "422":
          $ref: "#/components/responses/ValidationError"
  /admin/organizations/{organizationId}/users/{userId}/activation-email:
    post:
      tags: [Administration]
      operationId: resendAccountActivationEmail
      summary: Renvoyer le lien d'initialisation du mot de passe
      description: >-
        Réservé aux owner/admin autorisés. Le mot de passe reste exclusivement
        géré par le fournisseur d'identité et n'est jamais retourné par CONNECT.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Résultat de l'envoi, audité côté CONNECT
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/ActivationEmail"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          description: Rôle insuffisant ou CSRF rejeté
        "404":
          description: Compte introuvable
        "409":
          description: Initialisation déjà terminée
  /admin/organizations/{organizationId}/users/{userId}/password-reset-email:
    post:
      tags: [Administration]
      operationId: sendAccountPasswordResetEmail
      summary: Envoyer le reset natif du mot de passe d’un compte initialisé
      description: >-
        Réservé aux owner/admin autorisés. Le mot de passe reste exclusivement
        géré par le fournisseur d'identité et n'est jamais retourné par CONNECT.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Résultat de l'envoi, audité côté CONNECT
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/PasswordResetEmail"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          description: Rôle insuffisant ou CSRF rejeté
        "404":
          description: Compte introuvable
        "409":
          description: Initialisation encore requise
  /admin/organizations/{organizationId}/pending-identities/{pendingIdentityId}/reject:
    post:
      tags: [Administration]
      operationId: rejectPendingIdentity
      summary: Refuser une identité Drupal en attente
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PendingIdentityId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Demande refusée et auditée
        "403":
          description: Rôle insuffisant ou CSRF rejeté
        "404":
          description: Demande introuvable
        "409":
          description: Demande déjà traitée
  /admin/organizations/{organizationId}/users/{userId}/status:
    patch:
      tags: [Administration]
      operationId: updateManagedUserStatus
      summary: Activer, suspendre ou désactiver un compte CONNECT
      description: >-
        Réservé au rôle owner. La modification de son propre statut et la
        désactivation du dernier owner actif sont refusées.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusInput"
      responses:
        "200":
          description: Statut enregistré et audité
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/ManagedUser"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          description: Rôle insuffisant ou CSRF rejeté
        "404":
          description: Compte introuvable
        "409":
          description: Protection du compte courant ou du dernier owner
        "422":
          $ref: "#/components/responses/ValidationError"
  /admin/organizations/{organizationId}/users/{userId}/applications/{applicationCode}:
    put:
      tags: [Administration]
      operationId: updateManagedUserApplicationAccess
      summary: Autoriser ou révoquer une application pour un compte
      description: >-
        Le droit individuel complète le catalogue de l'organisation. Une
        révocation retire immédiatement l'application du catalogue du compte et
        bloque également son lancement direct. Les owners peuvent gérer tous les
        comptes ; les admins uniquement les membres et lecteurs.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/UserId"
        - name: applicationCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{1,63}$"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserApplicationAccessInput"
      responses:
        "200":
          description: Droit individuel enregistré et audité
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/UserApplicationAccess"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          description: Rôle insuffisant ou CSRF rejeté
        "404":
          description: Compte ou application indisponible
        "422":
          $ref: "#/components/responses/ValidationError"
  /admin/organizations/{organizationId}/users/{userId}/lifecycle:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: userId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: X-CSRF-Token
        in: header
        required: true
        schema: { type: string }
    patch:
      operationId: setAccountArchived
      summary: Archiver ou restaurer un compte éligible
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [archived]
              properties:
                archived: { type: boolean }
      responses:
        '200': { description: État du compte appliqué }
        '403': { description: Compte protégé ou droits insuffisants }
        '409': { description: Suppression en cours, compte partagé ou application à qualifier }
        '422': { description: Corps de demande invalide }
        '503': { description: Gestion du cycle de vie indisponible }
    delete:
      operationId: deleteManagedAccount
      summary: Supprimer définitivement le compte confirmé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmationEmail, keepReports]
              properties:
                confirmationEmail: { type: string, format: email }
                keepReports: { type: boolean }
      responses:
        '200':
          description: Compte CONNECT supprimé et choix de conservation des dossiers Rapport appliqué
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, deleted, reportsPreserved, identityPreserved]
                    properties:
                      id: { type: integer }
                      deleted: { type: boolean }
                      reportsPreserved: { type: boolean }
                      identityPreserved: { type: boolean }
        '403': { description: Compte protégé ou droits insuffisants }
        '409': { description: Dépendance protégée ou choix de reprise différent }
        '422': { description: Confirmation invalide }
        '503': { description: Intégration indisponible ou suppression bloquée à reprendre avec le même choix }
  /admin/organizations/{organizationId}/users/{userId}/access-period:
    patch:
      tags: [Administration]
      operationId: updateAccountAccessPeriod
      summary: Modifier la période d’un compte explicite membre
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [startsAt, endsAt]
              properties:
                startsAt: {type: [string, "null"], format: date-time}
                endsAt: {type: [string, "null"], format: date-time}
      responses:
        "200": {description: Période enregistrée et projection publiée}
        "403": {description: 'Compte protégé, autorisation ou CSRF refusé'}
        "422": {description: Deux dates requises ou deux valeurs nulles pour accès permanent}
        "503": {description: Service non configuré}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: AVEREO_CONNECT_SESSION
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PendingIdentityId:
      name: pendingIdentityId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
  responses:
    Appearance:
      description: Réglages du bandeau et du menu de compte
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {$ref: "#/components/schemas/Appearance"}
              meta: {$ref: "#/components/schemas/Meta"}
    AuthenticationRequired:
      description: Session absente ou expirée
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    OrganizationAccessDenied:
      description: Refus par défaut, adhésion ou ressource indisponible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CsrfRejected:
      description: Jeton CSRF absent ou invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Entrée invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdentityNotConfigured:
      description: Fournisseur Drupal non configuré
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Appearance:
      type: object
      additionalProperties: false
      required: [headerHeight, logoWidth, accountTone]
      properties:
        headerHeight: {type: integer, enum: [56, 68, 84], default: 68}
        logoWidth: {type: integer, enum: [100, 116, 136], default: 116}
        accountTone: {type: string, enum: [mist, white], default: mist}
        accountBadge:
          type: string
          minLength: 1
          maxLength: 3
          pattern: '^[\p{L}\p{Nd}]{1,3}$'
          default: MOI
          description: Texte du médaillon commun. Un ancien client qui omet ce champ conserve le texte enregistré.
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          minLength: 8
          maxLength: 64
    HealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status, service, database, time]
          properties:
            status:
              type: string
              enum: [ok, degraded]
            service:
              const: avereo-connect-api
            database:
              type: string
              enum: [ok, not_configured, unavailable]
            time:
              type: string
              format: date-time
        meta:
          $ref: "#/components/schemas/Meta"
    SessionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [authenticated, approved, accountStatus, remembered, csrfToken]
          properties:
            authenticated:
              type: boolean
            approved:
              type: boolean
            accountStatus:
              type: [string, "null"]
              enum: [active, pending, activation_required, rejected, suspended, disabled, null]
            remembered:
              type: boolean
            csrfToken:
              type: string
            registrationUrl:
              type: [string, "null"]
              format: uri
        meta:
          $ref: "#/components/schemas/Meta"
    LogoutResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [authenticated, redirectUrl]
          properties:
            authenticated:
              type: boolean
              const: false
            redirectUrl:
              type: string
              format: uri-reference
        meta:
          $ref: "#/components/schemas/Meta"
    UserResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/Meta"
    User:
      type: object
      required: [id, drupalSubject, email, displayName, status]
      properties:
        id:
          type: integer
          minimum: 1
        drupalSubject:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum: [active]
    AccountAdministration:
      type: object
      required:
        [organization, actorRole, assignableRoles, applications, pendingIdentities, users]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        actorRole:
          type: string
          enum: [owner, admin, access_manager]
          description: Le gestionnaire délégué peut seulement modifier les accès applicatifs dans cette organisation.
        assignableRoles:
          type: array
          items:
            type: string
            enum: [owner, admin, member, viewer]
        applications:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code:
                type: string
              name:
                type: string
        pendingIdentities:
          type: array
          items:
            $ref: "#/components/schemas/PendingIdentity"
        users:
          type: array
          items:
            $ref: "#/components/schemas/ManagedUser"
    PendingIdentity:
      type: object
      required: [id, firstSeenAt, lastSeenAt]
      properties:
        id:
          type: integer
          minimum: 1
        email:
          type: [string, "null"]
          format: email
        displayName:
          type: [string, "null"]
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    ManagedUser:
      type: object
      required:
        [id, displayName, status, role, canManageApplications, applications]
      properties:
        id:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum: [active, suspended, disabled]
        role:
          type: string
          enum: [owner, admin, member, viewer]
        membershipStatus:
          type: string
          enum: [active, suspended, revoked]
        canChangeStatus:
          type: boolean
        canManageApplications:
          type: boolean
        canSendActivationEmail:
          type: boolean
        archived:
          type: boolean
        canArchive:
          type: boolean
        canRestore:
          type: boolean
        canDelete:
          type: boolean
        lifecycleUnavailableReason:
          type: string
        deleteUnavailableReason:
          type: string
        canDeleteReports:
          type: boolean
        pendingDeletionKeepsReports:
          type: [boolean, "null"]
        onboardingStatus:
          type: string
          enum: [required, sent, completed]
        activationEmailSentAt:
          type: [string, "null"]
          format: date-time
        activationEmail:
          $ref: "#/components/schemas/ActivationEmail"
        applications:
          type: array
          items:
            $ref: "#/components/schemas/AccountApplicationAccess"
        createdAt:
          type: string
          format: date-time
    ApprovalInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, admin, member, viewer]
    ActivationEmail:
      type: object
      required: [status, expiresInSeconds, supportEmail]
      properties:
        status:
          type: string
          enum: [sent, failed, not_configured]
        expiresInSeconds:
          type: integer
          const: 86400
        supportEmail:
          type: string
          format: email
    PasswordResetEmail:
      type: object
      required: [status, expiresInSeconds, supportEmail]
      properties:
        status:
          type: string
          enum: [sent, failed, not_configured]
        expiresInSeconds:
          type: integer
          minimum: 0
          description: Délai natif Drupal en cas de succès, zéro si envoi indisponible ou échoué.
        supportEmail:
          type: string
          format: email
    UserStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended, disabled]
    UserApplicationAccessInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, revoked]
    UserApplicationAccess:
      type: object
      required: [userId, applicationCode, status, inherited]
      properties:
        userId:
          type: integer
          minimum: 1
        applicationCode:
          type: string
        applicationName:
          type: string
        status:
          type: string
          enum: [active, revoked]
        inherited:
          type: boolean
    AccountApplicationAccess:
      type: object
      required: [code, name, status, inherited]
      properties:
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, revoked]
        inherited:
          type: boolean
    Organization:
      type: object
      required: [id, name, slug, status, role]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active]
        role:
          type: string
          enum: [owner, admin, member, viewer, access_manager]
        canManageApplicationAccess:
          type: boolean
          description: Délégation applicative propre à cette adhésion.
    Application:
      type: object
      required: [code, name, launchUrl, entitlementStatus]
      properties:
        code:
          type: string
        name:
          type: string
        launchUrl:
          type: string
          format: uri-reference
        requiredScope:
          type: [string, "null"]
        entitlementStatus:
          type: string
          enum: [active]
        validFrom:
          type: [string, "null"]
          format: date-time
        validTo:
          type: [string, "null"]
          format: date-time
    CatalogApplication:
      type: object
      required: [code, name, description, launchUrl, available, status]
      properties:
        code:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{1,63}$"
        name:
          type: string
        description:
          type: string
        launchUrl:
          type: string
          format: uri-reference
        available:
          type: boolean
        status:
          type: string
          enum: [available, configuration_required]
    Entitlement:
      type: object
      required: [applicationCode, status]
      properties:
        applicationCode:
          type: string
        applicationName:
          type: string
        status:
          type: string
          enum: [active, suspended, revoked]
        validFrom:
          type: [string, "null"]
          format: date-time
        validTo:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EntitlementInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended, revoked]
        validFrom:
          type: [string, "null"]
          format: date-time
        validTo:
          type: [string, "null"]
          format: date-time
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          $ref: "#/components/schemas/Meta"
