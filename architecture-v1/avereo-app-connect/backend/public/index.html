<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>AVEREO CONNECT</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #142033;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: clamp(1rem, 4vw, 3rem); }
    main {
      width: min(100%, 1040px);
      margin: 0 auto;
      background: white;
      border-radius: 18px;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      box-shadow: 0 18px 60px #1e3a5f1f;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .badge {
      display: inline-block;
      padding: .35rem .65rem;
      border-radius: 999px;
      background: #fff4d6;
      color: #795600;
      font-weight: 700;
    }
    h1 { margin: 1.25rem 0 .5rem; font-size: clamp(2rem, 5vw, 3.25rem); }
    h2 { margin: 0; font-size: 1.5rem; }
    p { line-height: 1.55; }
    button, #login, .launch {
      border: 0;
      border-radius: 10px;
      padding: .85rem 1.1rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    #login, .launch { display: inline-block; background: #155eef; color: white; text-decoration: none; }
    #logout { background: #eef3f9; color: #142033; }
    #status {
      margin-top: 1rem;
      padding: .8rem;
      border-radius: 10px;
      background: #eef3f9;
    }
    #applications { margin-top: 2rem; border-top: 1px solid #dce4ef; padding-top: 1.75rem; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 1rem; }
    .section-heading p { margin: .35rem 0 0; color: #53627a; }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1rem;
      margin-top: 1.25rem;
    }
    .app-card {
      display: flex;
      min-height: 220px;
      flex-direction: column;
      padding: 1.25rem;
      border: 1px solid #dce4ef;
      border-radius: 14px;
      background: #fff;
    }
    .app-card.unavailable { background: #f8fafc; color: #58677d; }
    .app-code { margin: 0 0 .5rem; color: #155eef; font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .app-card h3 { margin: 0; font-size: 1.15rem; }
    .app-card p { margin: .75rem 0 1.25rem; }
    .app-actions { margin-top: auto; }
    .launch { display: inline-block; text-decoration: none; }
    .coming-soon { display: inline-block; padding: .7rem .9rem; border-radius: 10px; background: #e8edf4; font-weight: 700; }
    [hidden] { display: none !important; }
    @media (max-width: 560px) {
      .topbar, .section-heading { align-items: stretch; flex-direction: column; }
      #logout { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <span class="badge">Accès sécurisé</span>
      <button id="logout" type="button" hidden>Se déconnecter</button>
    </div>
    <h1>AVEREO CONNECT</h1>
    <p id="lead">Identifiez-vous avec votre compte AVEREO pour accéder à vos applications.</p>
    <a id="login" href="/api/v1/auth/login">Se connecter à AVEREO Connect</a>
    <div id="status" role="status" aria-live="polite">Contrôle de la session…</div>

    <section id="applications" aria-labelledby="applications-title" hidden>
      <div class="section-heading">
        <div>
          <h2 id="applications-title">Applications AVEREO</h2>
          <p>Sélectionnez une application pour l’ouvrir dans un nouvel onglet.</p>
        </div>
      </div>
      <div id="app-grid" class="app-grid"></div>
    </section>
  </main>
  <script>
    const statusNode = document.getElementById('status');
    const leadNode = document.getElementById('lead');
    const loginButton = document.getElementById('login');
    const logoutButton = document.getElementById('logout');
    const applicationsSection = document.getElementById('applications');
    const applicationGrid = document.getElementById('app-grid');
    let csrfToken = '';

    async function getJson(url, options = {}) {
      const response = await fetch(url, {
        credentials: 'same-origin',
        cache: 'no-store',
        ...options
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error?.code || 'REQUEST_FAILED');
      return payload;
    }

    async function session() {
      return getJson('/api/v1/session');
    }

    async function catalog() {
      return getJson('/api/v1/catalog');
    }

    function renderApplications(applications) {
      applicationGrid.replaceChildren();
      for (const application of applications) {
        const card = document.createElement('article');
        card.className = `app-card${application.available ? '' : ' unavailable'}`;

        const code = document.createElement('p');
        code.className = 'app-code';
        code.textContent = application.code;

        const title = document.createElement('h3');
        title.textContent = application.name;

        const description = document.createElement('p');
        description.textContent = application.description;

        const actions = document.createElement('div');
        actions.className = 'app-actions';
        if (application.available) {
          const link = document.createElement('a');
          link.className = 'launch';
          link.href = application.launchUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'Ouvrir l’application';
          actions.append(link);
        } else {
          const unavailable = document.createElement('span');
          unavailable.className = 'coming-soon';
          unavailable.textContent = 'Bientôt disponible';
          actions.append(unavailable);
        }

        card.append(code, title, description, actions);
        applicationGrid.append(card);
      }
    }

    async function refresh() {
      try {
        const sessionPayload = await session();
        csrfToken = sessionPayload.data.csrfToken;
        const authenticated = sessionPayload.data.authenticated === true;
        loginButton.hidden = authenticated;
        logoutButton.hidden = !authenticated;
        applicationsSection.hidden = true;

        if (!authenticated) {
          leadNode.textContent = 'Identifiez-vous avec votre compte AVEREO pour accéder à vos applications.';
          statusNode.textContent = 'Session anonyme.';
          return;
        }

        leadNode.textContent = 'Votre identité Drupal est validée. Vous pouvez accéder aux applications disponibles.';
        statusNode.textContent = 'Session Drupal authentifiée.';
        const catalogPayload = await catalog();
        renderApplications(catalogPayload.data);
        applicationsSection.hidden = false;
      } catch {
        statusNode.textContent = 'CONNECT ne peut pas charger votre session ou le catalogue.';
      }
    }

    logoutButton.addEventListener('click', async () => {
      logoutButton.disabled = true;
      statusNode.textContent = 'Fermeture de la session…';
      try {
        await getJson('/api/v1/auth/logout', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'X-CSRF-Token': csrfToken
          }
        });
        await refresh();
      } catch {
        statusNode.textContent = 'La déconnexion n’a pas abouti.';
      } finally {
        logoutButton.disabled = false;
      }
    });

    refresh();
  </script>
</body>
</html>
