<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>AVEREO CONNECT</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background: #f4f7fb; color: #142033; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(92vw, 680px); background: white; border-radius: 18px; padding: 2rem; box-shadow: 0 18px 60px #1e3a5f1f; }
    .badge { display: inline-block; padding: .35rem .65rem; border-radius: 999px; background: #fff4d6; color: #795600; font-weight: 700; }
    h1 { margin-bottom: .5rem; }
    p { line-height: 1.55; }
    button { border: 0; border-radius: 10px; padding: .85rem 1.1rem; background: #155eef; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { margin-top: 1rem; padding: .8rem; border-radius: 10px; background: #eef3f9; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Accès sécurisé</span>
    <h1>AVEREO CONNECT</h1>
    <p>Connectez-vous avec votre identité AVEREO pour accéder aux services autorisés.</p>
    <button id="login" type="button">Se connecter à AVEREO Connect</button>
    <div id="status" role="status">Contrôle de la session…</div>
  </main>
  <script>
    const statusNode = document.getElementById('status');
    const loginButton = document.getElementById('login');

    async function session() {
      const response = await fetch('/api/v1/session', { credentials: 'same-origin', cache: 'no-store' });
      if (!response.ok) throw new Error('SESSION_UNAVAILABLE');
      return response.json();
    }

    async function refresh() {
      try {
        const payload = await session();
        statusNode.textContent = payload.data.authenticated
          ? 'Session Drupal authentifiée.'
          : 'Session anonyme.';
        loginButton.hidden = payload.data.authenticated;
      } catch {
        statusNode.textContent = 'API CONNECT indisponible.';
      }
    }

    loginButton.addEventListener('click', async () => {
      loginButton.disabled = true;
      statusNode.textContent = 'Préparation de la connexion sécurisée…';
      try {
        const current = await session();
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          redirect: 'error',
          headers: {
            'Accept': 'application/json',
            'X-CSRF-Token': current.data.csrfToken,
            'X-AVEREO-Navigation': 'json'
          }
        });
        const payload = await response.json();
        if (!response.ok || !payload.data?.authorizeUrl) throw new Error('LOGIN_UNAVAILABLE');
        window.location.assign(payload.data.authorizeUrl);
      } catch {
        statusNode.textContent = 'La connexion ne peut pas être démarrée.';
        loginButton.disabled = false;
      }
    });

    refresh();
  </script>
</body>
</html>
