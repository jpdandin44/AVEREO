name: Deploy Coupe to O2Switch

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirmer le deploiement de production apres validation preproduction
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-coupe-o2switch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ inputs.confirm_production == true }}
    runs-on: ubuntu-latest
    environment: coupe
    defaults:
      run:
        working-directory: architecture-v1/avereo-app-coupe/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce main branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build frontend
        run: npm run build

      - name: Validate CONNECT gate
        run: |
          set -euo pipefail
          find public/connect -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php ../tests/connect-gate.php

      - name: Resolve FTPS target directory
        id: ftp-target
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
          CPANEL_SERVER: ${{ secrets.CPANEL_SERVER }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
        run: |
          set -euo pipefail
          server_dir="$(python3 "$GITHUB_WORKSPACE/.github/scripts/cpanel-domain-docroot.py" "coupe.avereo.fr")"
          server_dir="${server_dir#/}"
          server_dir="${server_dir%/}/"
          if [ "$server_dir" = "/" ]; then
            echo "Resolved FTPS target directory is empty." >&2
            exit 1
          fi
          echo "server_dir=$server_dir" >> "$GITHUB_OUTPUT"
          echo "Resolved FTPS target directory: $server_dir"

      - name: Backup current production
        env:
          FTP_BACKUP_DIR: ${{ runner.temp }}/coupe-production-backup
          FTP_PASSWORD: ${{ secrets.O2SWITCH_FTP_PASSWORD || secrets.CPANEL_PASSWORD }}
          FTP_PORT: ${{ vars.O2SWITCH_FTP_PORT || '21' }}
          FTP_PROTOCOL: ftps
          FTP_SERVER: ${{ secrets.O2SWITCH_FTP_SERVER || secrets.CPANEL_SERVER }}
          FTP_SERVER_DIR: ${{ steps.ftp-target.outputs.server_dir }}
          FTP_USERNAME: ${{ secrets.O2SWITCH_FTP_USER || secrets.CPANEL_USERNAME }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/ftps-backup-dir.py"

      - name: Store rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: coupe-production-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coupe-production-backup
          include-hidden-files: true
          retention-days: 30

      - name: Deploy with FTPS
        env:
          FTP_LOCAL_DIR: ${{ github.workspace }}/architecture-v1/avereo-app-coupe/frontend/dist
          FTP_PASSWORD: ${{ secrets.O2SWITCH_FTP_PASSWORD || secrets.CPANEL_PASSWORD }}
          FTP_PORT: ${{ vars.O2SWITCH_FTP_PORT || '21' }}
          FTP_PROTOCOL: ftps
          FTP_SERVER: ${{ secrets.O2SWITCH_FTP_SERVER || secrets.CPANEL_SERVER }}
          FTP_SERVER_DIR: ${{ steps.ftp-target.outputs.server_dir }}
          FTP_USERNAME: ${{ secrets.O2SWITCH_FTP_USER || secrets.CPANEL_USERNAME }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/ftps-deploy-dir.py"

      - name: Verify CONNECT is mandatory
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          status="$(curl -sS --max-time 20 -D "$headers" -o /dev/null -w '%{http_code}' 'https://coupe.avereo.fr/')"
          test "$status" = "303"
          grep -Eqi '^location:[[:space:]]*https://connect\.avereo\.fr/' "$headers"
          test "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' 'https://coupe.avereo.fr/connect/entry.php')" = "403"
