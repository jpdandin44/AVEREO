name: Deploy Prototype To GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirmer la publication après validation en préproduction
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_production == true }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./prototype-v1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
