name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run baseline checks
        run: npm run check

      - name: Reject UTF-8 BOM in Apache configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          offenders = [
              str(path)
              for path in Path("architecture-v1").rglob(".htaccess")
              if "dist" not in path.parts and path.read_bytes().startswith(b"\xef\xbb\xbf")
          ]
          if offenders:
              raise SystemExit("UTF-8 BOM interdit dans .htaccess: " + ", ".join(offenders))
          PY

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          find \
            architecture-v1/avereo-app-connect/backend \
            architecture-v1/avereo-app-rapport/frontend/public \
            architecture-v1/avereo-app-rapport/tests \
            architecture-v1/avereo-app-coupe/frontend/public \
            architecture-v1/avereo-app-coupe/tests \
            architecture-v1/avereo-app-projet/frontend/public \
            architecture-v1/avereo-app-thermo/frontend/public \
            architecture-v1/avereo-app-drone/frontend/public \
            architecture-v1/avereo-platform/shared \
            architecture-v1/avereo-platform/tests \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Test CONNECT application gateway
        run: |
          set -euo pipefail
          php architecture-v1/avereo-app-connect/backend/tests/run.php
          php architecture-v1/avereo-app-rapport/tests/connect-gate.php
          php architecture-v1/avereo-app-coupe/tests/connect-gate.php
          php architecture-v1/avereo-platform/tests/connect-gate.php

  frontend-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        application: [rapport, coupe, projet, thermo, drone]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: architecture-v1/avereo-app-${{ matrix.application }}/frontend
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build protected frontend
        working-directory: architecture-v1/avereo-app-${{ matrix.application }}/frontend
        run: npm run build

      - name: Validate CONNECT gate artifact
        working-directory: architecture-v1/avereo-app-${{ matrix.application }}/frontend
        run: |
          set -euo pipefail
          test -s dist/.htaccess
          test "$(xxd -p -l 3 dist/.htaccess)" != "efbbbf"
          test -s dist/index.php
          test -s dist/connect/entry.php
          test -s dist/connect/gate.php
          test -s dist/connect/logout.php

  connect-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: avereo_connect_ci
          MARIADB_ROOT_PASSWORD: root-ci-only
          MARIADB_USER: avereo_ci
          MARIADB_PASSWORD: avereo-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=avereo_connect_ci;charset=utf8mb4
      DB_USER: avereo_ci
      DB_PASSWORD: avereo-ci-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, openssl, pdo_mysql

      - name: Run CONNECT database integration
        working-directory: architecture-v1/avereo-app-connect/backend
        run: |
          set -euo pipefail
          php bin/migrate.php --direction=up
          php tests/integration.php
          php bin/migrate.php --direction=down --all
