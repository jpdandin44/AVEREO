name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run baseline checks
        run: npm run check

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          find \
            architecture-v1/avereo-app-connect/backend \
            architecture-v1/avereo-app-rapport/frontend/public \
            architecture-v1/avereo-app-rapport/tests \
            architecture-v1/avereo-app-coupe/frontend/public \
            architecture-v1/avereo-app-coupe/tests \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Test CONNECT application gateway
        run: |
          set -euo pipefail
          php architecture-v1/avereo-app-connect/backend/tests/run.php
          php architecture-v1/avereo-app-rapport/tests/connect-gate.php
          php architecture-v1/avereo-app-coupe/tests/connect-gate.php

  connect-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: avereo_connect_ci
          MARIADB_ROOT_PASSWORD: root-ci-only
          MARIADB_USER: avereo_ci
          MARIADB_PASSWORD: avereo-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=avereo_connect_ci;charset=utf8mb4
      DB_USER: avereo_ci
      DB_PASSWORD: avereo-ci-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, openssl, pdo_mysql

      - name: Run CONNECT database integration
        working-directory: architecture-v1/avereo-app-connect/backend
        run: |
          set -euo pipefail
          php bin/migrate.php --direction=up
          php tests/integration.php
          php bin/migrate.php --direction=down --all
