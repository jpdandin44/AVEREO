name: Deploy Vision to O2Switch
run-name: Vision - ${{ inputs.cible || 'verification PR' }} - ${{ github.ref_name }} - ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      cible:
        description: Cible de livraison
        required: true
        type: choice
        options: [preproduction, production]
      confirmation:
        description: Saisir DEPLOYER VISION EN PRODUCTION pour la production
        type: string
        default: ''
      migrations:
        description: Appliquer les migrations
        type: boolean
        default: true
  pull_request:
    paths:
      - architecture-v1/avereo-app-vision/**
      - .github/workflows/deploy-vision-o2switch.yml

permissions:
  contents: read

concurrency:
  group: vision-${{ inputs.cible || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  verification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vision
          MYSQL_ROOT_PASSWORD: vision-ci-only
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - name: Tests, build et validation sans secret
        run: bash architecture-v1/avereo-app-vision/deploiement/verifier-candidat.sh

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
    environment:
      name: ${{ inputs.cible == 'production' && 'vision' || 'vision-preprod' }}
      url: ${{ inputs.cible == 'production' && 'https://vision.avereo.fr' || 'https://vision-preprod.avereo.fr' }}
    env:
      DOMAIN: ${{ inputs.cible == 'production' && 'vision.avereo.fr' || 'vision-preprod.avereo.fr' }}
      PRIVATE_DIR: ${{ inputs.cible == 'production' && '.avereo/vision' || '.avereo/vision-preprod' }}
      O2SWITCH_HOST: ${{ secrets.O2SWITCH_HOST }}
      O2SWITCH_USER: ${{ secrets.O2SWITCH_USER }}
      # O2Switch reçoit le SSH sur le port 22 (constat du 26/11/2026) ; le secret partagé O2SWITCH_PORT vaut 8888.
      O2SWITCH_PORT: '22'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vision
          MYSQL_ROOT_PASSWORD: vision-ci-only
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Contrôles des entrées
        env:
          CIBLE: ${{ inputs.cible }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$CIBLE" in
            preproduction) [[ "$GITHUB_REF" == refs/heads/* ]] ;;
            production)
              test "$GITHUB_REF" = refs/heads/main
              test "$CONFIRMATION" = 'DEPLOYER VISION EN PRODUCTION'
              ;;
            *) echo 'Cible invalide.' >&2; exit 1 ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Vérifier la qualification du même SHA
        if: inputs.cible == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node architecture-v1/avereo-app-vision/deploiement/verifier-promotion.mjs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - name: Tests, build et validation du paquet
        id: candidat
        run: bash architecture-v1/avereo-app-vision/deploiement/verifier-candidat.sh
      - name: Résoudre la racine isolée
        id: target
        env:
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_SERVER: ${{ secrets.CPANEL_SERVER }}
        run: |
          set -euo pipefail
          # La 2FA de cPanel refuse l'API par mot de passe : jeton d'API obligatoire (procédure, étape 0).
          if [ -z "${CPANEL_API_TOKEN:-}" ]; then echo 'Secret CPANEL_API_TOKEN absent : créer un jeton d API cPanel (docs/deploiement-mutualise.md).' >&2; exit 1; fi
          target="$(python3 .github/scripts/cpanel-domain-docroot.py "$DOMAIN")"
          [[ -n "$target" && "$target" == *"$DOMAIN"* && "/$target/" != *'/../'* ]]
          echo "server_dir=${target%/}/" >> "$GITHUB_OUTPUT"
      - name: Identifier le runner
        id: runner-ip
        run: echo "ipv4=$(curl -fsS --max-time 20 https://api.ipify.org)" >> "$GITHUB_OUTPUT"
      - name: Autoriser temporairement SSH
        env:
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_SERVER: ${{ secrets.CPANEL_SERVER }}
          RUNNER_IPV4: ${{ steps.runner-ip.outputs.ipv4 }}
        run: |
          set -euo pipefail
          echo 'WHITELIST_ATTEMPTED=1' >> "$GITHUB_ENV"
          bash architecture-v1/avereo-app-vision/deploiement/autoriser-ssh.sh add
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.O2SWITCH_SSH_KEY }}
      - name: Vérifier la configuration privée par SSH
        env:
          CIBLE: ${{ inputs.cible }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # L'autorisation peut mettre un moment à s'appliquer au pare-feu : jusqu'à 3 minutes d'essais.
          for essai in $(seq 1 12); do
            if ssh-keyscan -T 15 -p "$O2SWITCH_PORT" "$O2SWITCH_HOST" > "$RUNNER_TEMP/cle-hote" 2>/dev/null && [ -s "$RUNNER_TEMP/cle-hote" ]; then break; fi
            echo "Port SSH pas encore joignable (essai $essai/12)."; sleep 15
          done
          [ -s "$RUNNER_TEMP/cle-hote" ] || { echo 'Port SSH injoignable depuis le runner.' >&2; exit 1; }
          cat "$RUNNER_TEMP/cle-hote" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -p "$O2SWITCH_PORT" "$O2SWITCH_USER@$O2SWITCH_HOST" \
            "php /dev/stdin \"\$HOME/$PRIVATE_DIR\" '$CIBLE'" < architecture-v1/avereo-app-vision/deploiement/verifier-prive.php
      - name: Appliquer les migrations avec un compte séparé
        if: inputs.migrations
        env:
          VISION_DB_MIGRATION_USER: ${{ secrets.VISION_DB_MIGRATION_USER }}
          VISION_DB_MIGRATION_PASSWORD: ${{ secrets.VISION_DB_MIGRATION_PASSWORD }}
        run: bash architecture-v1/avereo-app-vision/deploiement/transmettre-migrations.sh
      - name: Sauvegarder la racine actuelle
        env:
          SERVER_DIR: ${{ steps.target.outputs.server_dir }}
        run: |
          set -euo pipefail
          # Par SSH (clé d'hôte vérifiée) : le serveur FTP d'O2Switch présente une chaîne de certificats
          # que les clients stricts ne valident pas (constat du 26/11/2026).
          # cpanel-domain-docroot.py renvoie la racine relative au dossier personnel (ex. vision-preprod.avereo.fr).
          racine="${SERVER_DIR#/}"; racine="${racine%/}/"
          [[ "$racine" == "$DOMAIN/" ]] || { echo "Racine inattendue (attendu : $DOMAIN/ dans le dossier personnel)." >&2; exit 1; }
          echo "RACINE=$racine" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vision-backup/racine"
          rsync -rlt -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p $O2SWITCH_PORT" \
            "$O2SWITCH_USER@$O2SWITCH_HOST:$racine" "$RUNNER_TEMP/vision-backup/racine/"
          # SHA du candidat livré par ce run (pas de la version sauvegardée).
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/vision-backup/candidat-livre-sha.txt"
      - name: Conserver le retour arrière
        uses: actions/upload-artifact@v4
        with:
          name: vision-${{ inputs.cible }}-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vision-backup
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Publier par SSH (rsync)
        run: |
          set -euo pipefail
          test -s architecture-v1/avereo-app-vision/frontend/dist/index.html
          # --delete retire les anciens fichiers de Vision, mais jamais .well-known/ (renouvellement
          # Let's Encrypt) ni cgi-bin/ (créé par cPanel) : les exclusions les protègent.
          rsync -rlt --delete --chmod=D755,F644 \
            --exclude=/.well-known/ --exclude=/cgi-bin/ \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p $O2SWITCH_PORT" \
            architecture-v1/avereo-app-vision/frontend/dist/ "$O2SWITCH_USER@$O2SWITCH_HOST:$RACINE"
      - name: Vérifier les réponses publiques HTTPS
        run: node architecture-v1/avereo-app-vision/deploiement/verifier-public.mjs "$DOMAIN"
      - name: Résumé de livraison
        env:
          CIBLE: ${{ inputs.cible }}
          DIGEST: ${{ steps.candidat.outputs.sha256 }}
          MIGRATIONS: ${{ inputs.migrations }}
        run: |
          {
            echo "Cible : $CIBLE"
            echo "SHA : $GITHUB_SHA"
            echo "SHA-256 du paquet : $DIGEST"
            echo "Migrations demandées : $MIGRATIONS"
            if [ -f "$RUNNER_TEMP/vision-migrations.log" ]; then cat "$RUNNER_TEMP/vision-migrations.log"; fi
            echo "Retour arrière : vision-$CIBLE-before-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retirer l'autorisation SSH du runner
        if: always() && env.WHITELIST_ATTEMPTED == '1'
        env:
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_SERVER: ${{ secrets.CPANEL_SERVER }}
          RUNNER_IPV4: ${{ steps.runner-ip.outputs.ipv4 }}
        run: bash architecture-v1/avereo-app-vision/deploiement/autoriser-ssh.sh remove
