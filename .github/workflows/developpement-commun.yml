name: Developpement commun
on:
  push:
    paths:
      - 'outillage/protocole-developpement/**'
      - '.github/workflows/developpement-commun.yml'
  pull_request:
    paths:
      - 'outillage/protocole-developpement/**'
      - '.github/workflows/developpement-commun.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Documentation dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Check protocol and documentation
        run: |
          python -m unittest discover -s outillage/protocole-developpement/tests -p 'test_*.py'
          python outillage/protocole-developpement/scripts/check-docs.py
          git diff --check
