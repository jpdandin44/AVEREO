name: Passeport Immo CI

on:
  push:
    paths:
      - 'architecture-v1/avereo-app-passeport-immo/**'
      - '.github/workflows/ci-passeport-immo.yml'
      - 'architecture-v1/avereo-platform/shared/connect-gate.php'
      - 'architecture-v1/avereo-app-connect/backend/src/Config.php'
      - 'architecture-v1/avereo-app-connect/backend/public/index.php'
  pull_request:
    paths:
      - 'architecture-v1/avereo-app-passeport-immo/**'
      - '.github/workflows/ci-passeport-immo.yml'
      - 'architecture-v1/avereo-platform/shared/connect-gate.php'
      - 'architecture-v1/avereo-app-connect/backend/src/Config.php'
      - 'architecture-v1/avereo-app-connect/backend/public/index.php'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: architecture-v1/avereo-app-passeport-immo/frontend
        run: npm ci
      - name: Test
        working-directory: architecture-v1/avereo-app-passeport-immo/frontend
        run: npm test
      - name: Verify parity
        working-directory: architecture-v1/avereo-app-passeport-immo
        run: node tests/check-parity.mjs
      - name: Test packaging, preproduction and reviewed documents
        run: python3 -m unittest discover -s architecture-v1/avereo-app-passeport-immo/tests -p 'test_*.py'
      - name: Check cockpit tracking
        run: node architecture-v1/avereo-app-passeport-immo/tests/check-cockpit.mjs
      - name: Build
        working-directory: architecture-v1/avereo-app-passeport-immo/frontend
        run: npm run build
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Verify CONNECT launch contract
        run: php architecture-v1/avereo-app-passeport-immo/tests/connect-gate.php
      - name: Verify hosted entry under isolated Apache
        run: |
          docker build -f architecture-v1/avereo-app-passeport-immo/docker/connect-test.Dockerfile -t avereo-passeport-connect-test:local architecture-v1/avereo-app-passeport-immo
          python3 architecture-v1/avereo-app-passeport-immo/tests/check-connect-http.py
      - name: Verify private document storage under MariaDB
        run: python3 architecture-v1/avereo-app-passeport-immo/tests/check-storage-http.py
      - name: Package and verify candidate
        working-directory: architecture-v1/avereo-app-passeport-immo
        run: python3 workflows/package-candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: passeport-immo-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            architecture-v1/avereo-app-passeport-immo/.local/candidate.zip
            architecture-v1/avereo-app-passeport-immo/.local/candidate.manifest.json
          include-hidden-files: true
          if-no-files-found: error
